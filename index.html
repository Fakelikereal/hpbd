<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật!</title>
    <!-- Thư viện Canvas Confetti tạo hiệu ứng pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Container cho bóng bóng bay */
        .balloon-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .balloon {
            position: absolute;
            bottom: -100px;
            opacity: 0.7;
            border-radius: 50%;
            animation: floatUp 8s linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-120vh) rotate(360deg);
                opacity: 0;
            }
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(5px);
            animation: fadeIn 1.5s ease-in-out;
            position: relative;
            z-index: 10;
        }

        h1 {
            color: #ff4757;
            font-size: 2.2rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .cake-emoji {
            font-size: 4rem;
            margin: 15px 0;
            animation: bounce 2s infinite;
        }

        .message {
            color: #2f3542;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn-music {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.3s ease;
        }

        .btn-music:hover {
            background-color: #ff6b81;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <!-- Nơi chứa bong bóng -->
    <div class="balloon-container" id="balloonContainer"></div>

    <div class="card">
        <div class="cake-emoji">🎂✨</div>
        <h1>Chúc Mừng Sinh Nhật!</h1>
        
        <p class="message">
            Chúc mày sớm thống trị giới hoạ nô trong nước và thế giới! 🎨💖
        </p>

        <button class="btn-music" id="playBtn" onclick="toggleMusic()">🎵 Mở Nhạc Mừng Sinh Nhật</button>
    </div>

    <audio id="bgMusic" loop>
        <source src="hpbd.mp3" type="audio/mpeg">
    </audio>

    <script>
        const music = document.getElementById("bgMusic");
        const btn = document.getElementById("playBtn");

        music.loop = true;

        function toggleMusic() {
            if (music.paused) {
                music.play();
                btn.innerText = "⏸️ Tắt Nhạc";
                btn.style.backgroundColor = "#70a1ff";
                
                // Bắn pháo hoa khi bấm mở nhạc
                fireworks();
            } else {
                music.pause();
                btn.innerText = "🎵 Mở Nhạc Mừng Sinh Nhật";
                btn.style.backgroundColor = "#ff4757";
            }
        }

        // 1. Hàm tạo hiệu ứng pháo hoa giấy (Confetti)
        function fireworks() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                
                // Bắn pháo hoa từ 2 góc dưới màn hình
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        // 2. Hàm tạo bong bóng trôi từ dưới lên
        function createBalloons() {
            const container = document.getElementById('balloonContainer');
            const colors = ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ed4337', '#e84393'];
            const balloonCount = 15;

            for (let i = 0; i < balloonCount; i++) {
                const balloon = document.createElement('div');
                balloon.classList.add('balloon');

                // Kích thước ngẫu nhiên
                const size = Math.random() * 30 + 20;
                balloon.style.width = `${size}px`;
                balloon.style.height = `${size * 1.2}px`;

                // Màu sắc & vị trí ngẫu nhiên
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                balloon.style.left = `${Math.random() * 100}%`;
                
                // Thời gian bay và độ trễ ngẫu nhiên
                balloon.style.animationDuration = `${Math.random() * 5 + 6}s`;
                balloon.style.animationDelay = `${Math.random() * 5}s`;

                container.appendChild(balloon);
            }
        }

        // Tự động tạo bong bóng khi tải trang
        createBalloons();
    </script>
</body>
</html>
